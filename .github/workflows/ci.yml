name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - name: Verify public repository tree
        run: npm.cmd run release:verify-public-tree
      - name: Install frontend dependencies
        run: npm.cmd --prefix frontend ci
      - name: Install desktop dependencies
        run: npm.cmd --prefix desktop ci
      - name: Run offline checks
        run: npm.cmd run ci
